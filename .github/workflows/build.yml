name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK debug
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Compilar
        shell: bash
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew :app:assembleDebug --stacktrace --no-daemon
          else
            gradle :app:assembleDebug --stacktrace --no-daemon
          fi

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: MyPlayer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Subir reportes si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-de-error
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
          if-no-files-found: ignore
